<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sum.A Technologies</title>
<meta name="description" content="Sum.A Technologies — coming soon.">
<style>
  :root {
    --bg: #0b0b0d;
    --ink: #f4f1ea;
    --muted: #8b8a85;
    --accent: #d8a24a;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    text-align: center;
    padding: 2rem;
    -webkit-font-smoothing: antialiased;
  }
  .wrap {
    animation: fade 1.1s ease both;
  }
  .mark {
    font-size: clamp(3rem, 14vw, 6.5rem);
    font-weight: 600;
    letter-spacing: -0.02em;
    line-height: 1;
  }
  .mark .dot, .mark .a { color: var(--accent); }
  .tag {
    margin-top: 1.6rem;
    font-size: clamp(0.8rem, 3.5vw, 1rem);
    letter-spacing: 0.42em;
    text-transform: uppercase;
    color: var(--muted);
    padding-left: 0.42em;
  }
  .rule {
    width: 42px;
    height: 2px;
    background: var(--accent);
    margin: 2rem auto 0;
    opacity: 0.85;
  }
  .foot {
    position: fixed;
    bottom: 1.6rem;
    left: 0;
    right: 0;
    font-size: 0.72rem;
    letter-spacing: 0.28em;
    text-transform: uppercase;
    color: var(--muted);
    opacity: 0.7;
  }
  @keyframes fade {
    from { opacity: 0; transform: translateY(10px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  @media (prefers-reduced-motion: reduce) {
    .wrap { animation: none; }
  }
</style>
</head>
<body>
  <div class="wrap">
    <div class="mark">Sum<span class="dot">.</span><span class="a">A</span></div>
    <div class="tag">Coming soon</div>
    <div class="rule"></div>
  </div>
  <div class="foot">Sum.A Technologies</div>
</body>
</html>
